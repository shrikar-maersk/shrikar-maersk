name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: shrikar-maersk
          template: classic
          base: header, metadata
          config_timezone: Asia/Kolkata
          config_display: columns

          # Dark theme to match the profile (SVG defaults to light)
          extras_css: |
            svg { color: #c9d1d9 !important; }
            h1, h2, h3 { color: #58a6ff !important; }
            .field svg { fill: #8b949e !important; }
            small, footer { color: #8b949e !important; }
            [fill="#ebedf0"] { fill: #161b22 !important; }
            [fill="#9be9a8"] { fill: #0e4429 !important; }
            [fill="#40c463"] { fill: #006d32 !important; }
            [fill="#30a14e"] { fill: #26a641 !important; }
            [fill="#216e39"] { fill: #39d353 !important; }
            [fill="#d1d5da"] { fill: #21262d !important; }

          # Languages (works — reads repo metadata incl. private via token)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_recent_days: 365

          # Contribution calendar (works — uses contributionsCollection)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Stars
          plugin_stars: yes
          plugin_stars_limit: 4
